name: Deploy

# Builds the site with the latest Dygo docs and publishes it to GitHub Pages.
# sync-docs.yml calls this workflow when the docs change.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      docs_ref:
        description: Dygo ref to take the docs from
        default: main
  workflow_call:
    inputs:
      docs_ref:
        type: string
        default: main

permissions:
  contents: read

# One deploy at a time. A newer run waits instead of cancelling a deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    env:
      DOCS_SOURCE: .dygo-src
      DOCS_REF: ${{ inputs.docs_ref || 'main' }}
      DYGO_ENV: production
      # Set under Settings → Secrets and variables → Actions → Variables.
      # A production build fails without it.
      PUBLIC_CONTACT_FORM_URL: ${{ vars.PUBLIC_CONTACT_FORM_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dygoframework/dygo
          ref: ${{ env.DOCS_REF }}
          path: .dygo-src
          fetch-depth: 0 # tags, for the version in the top bar
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run sync-docs
      - run: npm run build
      - name: Production build leaves out dev pages
        run: |
          test ! -e dist/styleguide
          test ! -e dist/docs/test
          test "$(cat dist/CNAME)" = "www.dygoframework.com"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
