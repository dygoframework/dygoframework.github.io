<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dygo Logo Options</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 1080px; box-sizing: border-box; padding: 56px 64px; background: #0B0B0C; color: #F4F4EF; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; gap: 36px">
<sc-for list="{{options}}" as="opt" hint-placeholder-count="3">
<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 20px; font-weight: 600">{{opt.name}}</h2>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
<div style="height: 240px; background: #121211; border: 1px solid #2A2A28; display: flex; align-items: center; justify-content: center; gap: 16px">
<svg width="72" height="72" viewBox="0 0 64 64" role="img" aria-label="{{opt.name}} mark on black"><path d="{{opt.path}}" fill="{{accent}}" fill-rule="evenodd"></path></svg>
<span style="font-size: 44px; font-weight: 800; letter-spacing: -0.02em">Dygo</span>
</div>
<div style="height: 240px; background: {{accent}}; color: #0B0B0C; display: flex; align-items: center; justify-content: center; gap: 16px">
<svg width="72" height="72" viewBox="0 0 64 64" role="img" aria-label="{{opt.name}} mark on yellow"><path d="{{opt.path}}" fill="#0B0B0C" fill-rule="evenodd"></path></svg>
<span style="font-size: 44px; font-weight: 800; letter-spacing: -0.02em">Dygo</span>
</div>
<div style="height: 240px; background: #F4F4EF; color: #0B0B0C; display: flex; align-items: center; justify-content: center; gap: 16px">
<svg width="72" height="72" viewBox="0 0 64 64" role="img" aria-label="{{opt.name}} mark on white"><path d="{{opt.path}}" fill="#0B0B0C" fill-rule="evenodd"></path></svg>
<span style="font-size: 44px; font-weight: 800; letter-spacing: -0.02em">Dygo</span>
</div>
<div style="height: 240px; background: #121211; border: 1px solid #2A2A28; display: flex; align-items: center; justify-content: center; gap: 28px">
<svg width="96" height="96" viewBox="0 0 64 64" role="img" aria-label="{{opt.name}} at 96 pixels"><path d="{{opt.path}}" fill="{{accent}}" fill-rule="evenodd"></path></svg>
<svg width="48" height="48" viewBox="0 0 64 64" role="img" aria-label="{{opt.name}} at 48 pixels"><path d="{{opt.path}}" fill="{{accent}}" fill-rule="evenodd"></path></svg>
<svg width="32" height="32" viewBox="0 0 64 64" role="img" aria-label="{{opt.name}} at 32 pixels"><path d="{{opt.path}}" fill="{{accent}}" fill-rule="evenodd"></path></svg>
<svg width="16" height="16" viewBox="0 0 64 64" role="img" aria-label="{{opt.name}} at 16 pixels"><path d="{{opt.path}}" fill="{{accent}}" fill-rule="evenodd"></path></svg>
</div>
</div>
</section>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFD400","options":["#FFD400","#FFC400","#F5E11B"]},"$preview":{"width":1440,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#FFD400',
      options: [
        { name: 'A. Forward D', path: 'M10 6H34L58 32L34 58H10ZM23 19V45H29L41 32L29 19Z' },
        { name: 'B. Gate', path: 'M8 6H20V58H8ZM28 6H41L60 32L41 58H28L47 32Z' },
        { name: 'C. Shield', path: 'M32 3L57 11V31C57 45 47 55 32 61C17 55 7 45 7 31V11ZM23 17L36 32L23 47H34L47 32L34 17Z' }
      ]
    };
  }
}
</script>
</body>
</html>
